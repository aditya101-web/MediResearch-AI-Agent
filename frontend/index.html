<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- SEO -->
  <title>MediResearch AI — Medical Research Assistant</title>
  <meta name="description" content="Upload medical research PDFs, ask questions, and get evidence-based answers with source citations. Powered by RAG + Llama 3.2." />
  <meta name="theme-color" content="#0a0f1e" />

  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="/static/assets/favicon.svg" />

  <!-- Stylesheet -->
  <link rel="stylesheet" href="/static/css/styles.css" />
</head>
<body>

  <div id="app-container">

    <!-- Sidebar Overlay (mobile) -->
    <div id="sidebar-overlay"></div>

    <!-- ====================================================
         LEFT SIDEBAR
         ==================================================== -->
    <aside id="sidebar">

      <!-- Brand -->
      <div class="sidebar-header">
        <div class="sidebar-brand">
          <img src="/static/assets/favicon.svg" alt="MediResearch AI" />
          <h1>Medi<span>Research</span> AI</h1>
        </div>
        <button id="new-chat-btn" title="New Chat">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="12" y1="5" x2="12" y2="19"></line>
            <line x1="5" y1="12" x2="19" y2="12"></line>
          </svg>
          New Chat
        </button>
      </div>

      <!-- Documents Section -->
      <div class="sidebar-section">
        <div class="sidebar-section-header">
          <span class="sidebar-section-title">Documents</span>
          <label class="sidebar-upload-btn" id="sidebar-upload-label" title="Upload PDF">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
              <polyline points="17 8 12 3 7 8"></polyline>
              <line x1="12" y1="3" x2="12" y2="15"></line>
            </svg>
            <input type="file" id="sidebar-file-input" accept=".pdf" multiple hidden />
          </label>
        </div>
        <div id="document-list" class="sidebar-doc-list">
          <!-- Populated by JS -->
        </div>
      </div>

      <!-- Conversations Section -->
      <div class="sidebar-section sidebar-section-grow">
        <div class="sidebar-section-header">
          <span class="sidebar-section-title">Conversations</span>
        </div>
        <nav id="conversation-list" class="sidebar-conversations">
          <!-- Populated by JS -->
        </nav>
      </div>

      <!-- Footer -->
      <div class="sidebar-footer">
        Powered by Llama 3.2 &amp; ChromaDB
      </div>

    </aside>

    <!-- ====================================================
         MAIN CONTENT
         ==================================================== -->
    <main id="main-content">

      <!-- Top Bar (mobile) -->
      <div id="top-bar">
        <button id="sidebar-toggle" aria-label="Toggle sidebar">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="3" y1="12" x2="21" y2="12"></line>
            <line x1="3" y1="6" x2="21" y2="6"></line>
            <line x1="3" y1="18" x2="21" y2="18"></line>
          </svg>
        </button>
        <span id="top-bar-title">MediResearch AI</span>
      </div>

      <!-- Document Cards Bar -->
      <div id="doc-cards-bar" class="doc-cards-bar hidden">
        <div id="doc-cards-container" class="doc-cards-container">
          <!-- Populated by JS -->
        </div>
      </div>

      <!-- Chat Area -->
      <div id="chat-area">
        <div id="welcome-screen"><!-- Populated by JS --></div>
        <div id="chat-messages"><!-- Messages by JS --></div>
      </div>

      <!-- Input Bar -->
      <div id="input-bar">
        <div id="input-wrapper">
          <label class="attach-btn" id="attach-label" title="Attach PDF">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"></path>
            </svg>
            <input type="file" id="attach-file-input" accept=".pdf" multiple hidden />
          </label>
          <textarea
            id="question-input"
            placeholder="Ask about your research papers..."
            rows="1"
            aria-label="Question input"
          ></textarea>
          <button id="send-btn" disabled aria-label="Send question">
            <svg class="send-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <line x1="22" y1="2" x2="11" y2="13"></line>
              <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
            </svg>
            <div class="spinner" style="display: none;"></div>
          </button>
        </div>
        <div id="input-hint">
          <strong>Enter</strong> to send · <strong>Shift+Enter</strong> new line · <strong>📎</strong> attach PDF
        </div>
      </div>

    </main>

  </div>

  <!-- Upload Progress Modal -->
  <div id="upload-modal" class="upload-modal hidden">
    <div class="upload-modal-content">
      <div class="upload-modal-icon">📄</div>
      <div id="upload-modal-filename" class="upload-modal-filename"></div>
      <div id="upload-modal-status" class="upload-modal-status">Uploading...</div>
      <div class="upload-modal-progress">
        <div id="upload-modal-bar" class="upload-modal-bar"></div>
      </div>
    </div>
  </div>

  <script src="/static/js/app.js"></script>

</body>
</html>
